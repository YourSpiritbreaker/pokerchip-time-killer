<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PokerChip Time Killer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--blue:#0f1fa8;--navy:#0a1470;--ink:#1b1030;--yel:#ffe23a;--yel2:#c08a00;--yel3:#fff7a0;--red:#e8141c;--red2:#8a0a12;--white:#fff;--sky:#3aa0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050a3a;overflow:hidden;font-family:'Pixelify Sans',monospace;user-select:none;-webkit-user-select:none}
img{image-rendering:pixelated;image-rendering:crisp-edges;-webkit-user-drag:none}
#stage{position:absolute;left:50%;top:50%;width:960px;height:600px;transform-origin:50% 50%;background:var(--blue);overflow:hidden;box-shadow:0 0 0 4px var(--ink)}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);z-index:50}
section{position:absolute;inset:0}
[hidden]{display:none!important}
.abs{position:absolute}

/* ---------- pixel buttons ---------- */
.btn{position:absolute;font-family:'Pixelify Sans',monospace;font-weight:700;font-size:23px;color:var(--ink);background:var(--yel);border:0;padding:0;cursor:pointer;letter-spacing:.5px;
  box-shadow:inset -4px -4px 0 var(--yel2),inset 4px 4px 0 var(--yel3),0 0 0 3px var(--ink),5px 5px 0 3px rgba(0,0,0,.45)}
.btn:active:not(:disabled),.btn.down{box-shadow:inset 4px 4px 0 var(--yel2),inset -4px -4px 0 var(--yel3),0 0 0 3px var(--ink);transform:translate(3px,3px)}
.btn:disabled{background:#8c8c70;box-shadow:inset -4px -4px 0 #5c5c48,inset 4px 4px 0 #b4b49c,0 0 0 3px var(--ink),5px 5px 0 3px rgba(0,0,0,.45);color:#3c3c30;cursor:default}
.btn.red{background:var(--red);color:#fff;box-shadow:inset -4px -4px 0 var(--red2),inset 4px 4px 0 #ff8080,0 0 0 3px var(--ink),5px 5px 0 3px rgba(0,0,0,.45)}
.btn.grn{background:#2fd05a;box-shadow:inset -4px -4px 0 #127a30,inset 4px 4px 0 #a8ffbe,0 0 0 3px var(--ink),5px 5px 0 3px rgba(0,0,0,.45)}
.btn.small{font-size:16px}

/* ---------- splash ---------- */
#splash{background:radial-gradient(ellipse at 50% 40%,#2236d0 0%,var(--blue) 45%,#070f60 100%)}
.star{position:absolute;width:4px;height:4px;background:#fff;animation:tw 1.6s steps(2) infinite}
@keyframes tw{50%{opacity:.15}}
#logo{position:absolute;left:50%;top:22px;width:520px;transform:translateX(-50%);animation:bob 1.2s steps(4) infinite alternate;image-rendering:auto}
@keyframes bob{to{transform:translateX(-50%) translateY(-8px)}}
#play{left:50%;top:388px;width:340px;height:84px;margin-left:-170px;font-family:'Press Start 2P',monospace;font-size:28px;color:#fff;background:var(--red);
  box-shadow:inset -6px -6px 0 var(--red2),inset 6px 6px 0 #ff8a8a,0 0 0 4px var(--ink),0 0 0 8px var(--yel),0 0 0 11px var(--ink);text-shadow:3px 3px 0 var(--ink);animation:pulse .9s steps(6) infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09);filter:brightness(1.25)}}
#play:active{animation:none;transform:scale(.96)}
#fame{left:50%;top:494px;width:560px;margin-left:-280px;text-align:center;color:#c8d4ff;font-size:16px;line-height:1.35}
#fame b{color:var(--yel)}
#legal{left:0;right:0;bottom:8px;text-align:center;color:#8898e8;font-size:13px}

/* ---------- paytable (single hand) ---------- */
#pt{left:10px;top:8px;width:940px;height:186px;border:3px solid var(--yel);background:var(--navy);display:grid;grid-template-columns:1fr repeat(5,96px);font-weight:700;color:var(--yel);line-height:1;overflow:hidden}
#pt .c{display:flex;align-items:center;justify-content:flex-end;padding:0 10px;border-left:3px solid var(--yel);white-space:nowrap}
#pt .l{display:flex;align-items:center;padding:0 0 0 10px;overflow:hidden;white-space:nowrap}
#pt .l::after{content:'';flex:1;margin:0 8px;border-bottom:3px dotted var(--yel);transform:translateY(5px)}
#pt .act{background:var(--red);color:#fff}
#pt .win{animation:blink .4s steps(1) infinite}
#pt .dealt{color:#fff}
@keyframes blink{0%{background:#fff;color:var(--red)}50%{}}

/* side paytables (multi-hand) */
.sidept{top:10px;width:128px;display:flex;flex-direction:column;gap:8px}
#ptL{left:12px} #ptR{right:12px}
.pbox{border:3px solid #ff4a4a;box-shadow:0 0 0 2px var(--ink);background:var(--navy);text-align:center;font-weight:700}
.pbox .pl{color:#fff;font-size:14px;padding:3px 2px;line-height:1.05}
.pbox .pv{background:var(--yel);color:var(--ink);font-size:17px;padding:1px 0}
.pbox.win{animation:pblink .4s steps(1) infinite}.pbox.win .pv{animation:blink .4s steps(1) infinite}
@keyframes pblink{0%{border-color:#fff}50%{border-color:#ff4a4a}}

/* ---------- cards & hands ---------- */
.hand{position:absolute}
.hand img{position:absolute;top:0;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35))}
.hand img.flip{animation:flip .16s steps(3)}
@keyframes flip{from{transform:scaleX(.1)}to{transform:scaleX(1)}}
.hand img.dim{filter:brightness(.55)}
.held{position:absolute;color:#fff;font-weight:700;text-align:center;font-size:22px;text-shadow:2px 2px 0 var(--ink);visibility:hidden}
.held.on{visibility:visible}
.held.dealer{color:var(--yel)}
.badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;border:3px solid var(--sky);box-shadow:0 0 0 2px var(--ink);font-weight:700;white-space:nowrap;z-index:5}
.badge span:first-child{background:var(--red);color:#fff;padding:2px 8px}
.badge span:last-child{background:var(--yel);color:var(--ink);padding:2px 8px}
.coin{position:absolute;background:var(--yel);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;z-index:4;
  clip-path:polygon(30% 0,70% 0,70% 10%,85% 10%,85% 20%,95% 20%,95% 35%,100% 35%,100% 65%,95% 65%,95% 80%,85% 80%,85% 90%,70% 90%,70% 100%,30% 100%,30% 90%,15% 90%,15% 80%,5% 80%,5% 65%,0 65%,0 35%,5% 35%,5% 20%,15% 20%,15% 10%,30% 10%);
  box-shadow:inset 0 0 0 2px var(--ink)}
.slot{position:absolute;cursor:pointer}
#msg{left:0;right:0;top:197px;height:26px;text-align:center;color:#fff;font-weight:700;font-size:24px;letter-spacing:1px;text-shadow:2px 2px 0 var(--ink)}
#msg.big{color:var(--yel);animation:flash .5s steps(1) infinite}
@keyframes flash{50%{color:#fff}}

/* ---------- meters / bar ---------- */
.meter{font-family:'Press Start 2P',monospace;font-size:22px;color:var(--red);
  text-shadow:2px 0 0 var(--yel),-2px 0 0 var(--yel),0 2px 0 var(--yel),0 -2px 0 var(--yel),2px 2px 0 var(--yel),-2px -2px 0 var(--yel),2px -2px 0 var(--yel),-2px 2px 0 var(--yel),4px 4px 0 var(--ink)}
#winM{left:16px;top:436px}
#credM{right:16px;top:436px;text-align:right}
#betM{left:410px;width:140px;top:434px;text-align:center;color:#fff;font-weight:700;font-size:20px;text-shadow:2px 2px 0 var(--ink)}
#hint{left:300px;top:432px;width:92px;height:28px;font-size:15px}
#owe{left:568px;top:432px;width:168px;height:28px;border:3px solid var(--ink);background:#3a0a10;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;cursor:pointer}
#owe i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--red) 0 6px,#b80c14 6px 8px);font-style:normal}
#owe span{position:relative;width:100%;text-align:center;text-shadow:2px 2px 0 var(--ink)}
#coinBtn{left:410px;top:470px;width:140px;height:62px;font-family:'Press Start 2P',monospace;font-size:20px;color:var(--ink);
  clip-path:polygon(12% 0,88% 0,88% 8%,95% 8%,95% 22%,100% 22%,100% 78%,95% 78%,95% 92%,88% 92%,88% 100%,12% 100%,12% 92%,5% 92%,5% 78%,0 78%,0 22%,5% 22%,5% 8%,12% 8%);
  background:radial-gradient(ellipse at 50% 45%,#fff7a0 0 30%,var(--yel) 31% 62%,var(--yel2) 63% 72%,var(--yel) 73%);box-shadow:none}
#coinBtn:active{transform:translate(2px,2px)}
.speed i{font-style:normal;color:#9b8a3a}
.speed i.on{color:var(--red)}
#foot{left:12px;right:12px;top:540px;height:18px;display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:15px;text-shadow:2px 2px 0 var(--ink)}
#strip{left:10px;right:10px;top:562px;height:30px;background:var(--navy);border:3px solid var(--yel);display:flex;align-items:center;justify-content:space-around;color:#c8d4ff;font-size:15px;font-weight:500;white-space:nowrap}
#strip b{color:#fff;font-weight:700}
#strip .neg{color:#ff6a6a} #strip .pos{color:#5dff8a}

/* ---------- modal (RPG dialog) ---------- */
#modal{position:absolute;inset:0;background:rgba(5,10,58,.72);z-index:40;display:flex;align-items:center;justify-content:center}
.win16{position:relative;min-width:440px;max-width:760px;background:linear-gradient(#2a3ee0,#101c90);color:#fff;padding:22px 26px 20px;
  box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink),0 0 0 10px #8aa0ff,0 0 0 13px var(--ink),10px 10px 0 13px rgba(0,0,0,.4)}
.ledger.two{grid-template-columns:1fr auto 1fr auto;font-size:16px;gap:3px 18px}
.win16 h2{margin:0 0 12px;font-family:'Press Start 2P',monospace;font-size:18px;color:var(--yel);text-shadow:3px 3px 0 var(--ink);line-height:1.4}
.win16 p{margin:0 0 14px;font-size:21px;line-height:1.35;text-shadow:2px 2px 0 var(--ink)}
.win16 .row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.win16 .btn{position:relative;height:46px;padding:0 18px;font-size:20px}
.win16 input{width:100%;font-family:'Press Start 2P',monospace;font-size:22px;padding:12px;background:#050a3a;color:var(--yel);border:0;outline:none;text-transform:uppercase;
  box-shadow:inset 0 0 0 3px #8aa0ff,0 0 0 3px var(--ink);margin-bottom:16px}
.win16 .cur{animation:tw .8s steps(1) infinite}
.ledger{display:grid;grid-template-columns:1fr auto;gap:2px 28px;font-size:18px;margin-bottom:14px;text-shadow:2px 2px 0 var(--ink)}
.ledger b{text-align:right;color:var(--yel)} .ledger b.neg{color:#ff7a7a} .ledger b.pos{color:#6dff96}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.seg .btn{font-size:16px;height:38px;padding:0 12px}
.seg .btn.sel{background:#fff;box-shadow:inset -4px -4px 0 #b0b0c0,inset 4px 4px 0 #fff,0 0 0 3px var(--yel),0 0 0 6px var(--ink)}
.lbl{font-size:15px;color:#c8d4ff;letter-spacing:1px}
.who{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
#rot{position:fixed;left:0;right:0;bottom:0;padding:8px;text-align:center;background:var(--ink);color:var(--yel);font:700 14px 'Pixelify Sans',monospace;z-index:99}
@media (prefers-reduced-motion:reduce){#play,#logo,.star,#msg.big,#pt .win,.pbox.win{animation:none}}
</style>
</head>

// PokerChip Time Killer — poker engine (no DOM; also runs inside the hint Web Worker)
// Card encoding: 0..51 = rank*4 + suit (rank 0..12 = 2..A, suit 0..3 = ♠♥♦♣); 52 = Joker.
var JOKER = 52;
var C = { NRF:0, FOUR_DEUCES:1, WRF:2, FIVE:3, SF:4, A4K:5, L4K:6, A4:7, L4:8, K4:9,
          FH:10, FL:11, ST:12, T3:13, TP:14, PAIR:15, NONE:16 };
var NCODES = 17;
var ROYAL_MASK = 0x1F00, WHEEL_MASK = 0x100F;
var _cnt = new Int8Array(13);

function makeDeck(joker) { var d = []; for (var i = 0; i < 52; i++) d.push(i); if (joker) d.push(JOKER); return d; }

function randInt(n) {
  var a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n;
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = randInt(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

// mode: 0 = no wilds, 1 = deuces wild, 2 = joker wild. minPair: rank index of lowest paying pair.
function evaluate(h, mode, minPair) {
  var cnt = _cnt; cnt.fill(0);
  var w = 0, suit = -1, flush = true, mask = 0, hi = -1, i, r, c;
  for (i = 0; i < 5; i++) {
    c = h[i];
    if ((mode === 2 && c === JOKER) || (mode === 1 && c < 4)) { w++; continue; }
    r = c >> 2; var s = c & 3;
    cnt[r]++; mask |= 1 << r;
    if (suit < 0) suit = s; else if (s !== suit) flush = false;
    if (r > hi) hi = r;
  }
  if (mode === 1 && w === 4) return C.FOUR_DEUCES;
  var m1 = 0, m2 = 0, r1 = -1;
  for (r = 0; r < 13; r++) { var k = cnt[r]; if (!k) continue; if (k > m1) { m2 = m1; m1 = k; r1 = r; } else if (k > m2) m2 = k; }
  var straight = false, royal = false;
  if (m1 === 1) {
    if ((mask & ~ROYAL_MASK) === 0) { royal = true; straight = true; }
    else if ((mask & ~WHEEL_MASK) === 0) straight = true;
    else for (var lo = 0; lo <= 8; lo++) if ((mask & ~(0x1F << lo)) === 0) { straight = true; break; }
  }
  if (royal && flush) return w === 0 ? C.NRF : C.WRF;
  if (m1 + w >= 5) return C.FIVE;
  if (straight && flush) return C.SF;
  if (m1 + w >= 4) {
    if (mode !== 0) return C.K4;
    var kick = -1; for (r = 0; r < 13; r++) if (cnt[r] === 1) { kick = r; break; }
    if (r1 === 12) return kick <= 2 ? C.A4K : C.A4;
    if (r1 <= 2) return (kick === 12 || kick <= 2) ? C.L4K : C.L4;
    return C.K4;
  }
  if ((m1 === 3 && m2 === 2) || (w === 1 && m1 === 2 && m2 === 2)) return C.FH;
  if (flush) return C.FL;
  if (straight) return C.ST;
  if (m1 + w >= 3) return C.T3;
  if (m1 === 2 && m2 === 2) return C.TP;
  if (m1 === 2) return r1 >= minPair ? C.PAIR : C.NONE;
  if (w === 1) return hi >= minPair ? C.PAIR : C.NONE;
  return C.NONE;
}

// Exact expected value (per coin) of all 32 hold choices, by enumerating every possible draw.
// pay[code] = payout per coin. Bit i of the index = card i held.
function enumerateEV(hand, deck, mode, minPair, pay) {
  var out = new Float64Array(32), h = hand.slice(), n = deck.length, free = [0,0,0,0,0];
  var sum, cnt, k;
  function rec(start, d) {
    if (d === k) { sum += pay[evaluate(h, mode, minPair)]; cnt++; return; }
    var slot = free[d], end = n - (k - d);
    for (var i = start; i <= end; i++) { h[slot] = deck[i]; rec(i + 1, d + 1); }
  }
  for (var m = 0; m < 32; m++) {
    k = 0;
    for (var i = 0; i < 5; i++) { if (m & (1 << i)) h[i] = hand[i]; else free[k++] = i; }
    sum = 0; cnt = 0; rec(0, 0);
    out[m] = sum / cnt;
  }
  return out;
}

if (typeof module !== 'undefined') module.exports = { JOKER:JOKER, C:C, NCODES:NCODES, makeDeck:makeDeck, shuffle:shuffle, evaluate:evaluate, enumerateEV:enumerateEV };

    ["...XXX...","..XXXXX..","..XXXXX..","XX.XXX.XX","XXXXXXXXX","XXXXXXXXX","XX.XXX.XX","....X....","...XXX..."]  // club
  ];
  function mir(rows){ return rows.map(function(l){ return l + l.split('').reverse().join(''); }); }
  var KING = mir([
    "...y....y.","...yy..yyy","...yyyyyyy","...ybyyzyy","...YYYYYYY","..gggggggg","..gsssssss","..gsGGssss",
    "..gssKssss","..gspsssss","..gssssssS","..wwwwwwww","..wwwwwwmm","..wwwwwwww","...wwwwwww","rrrr.wwwww",
    "rRrrr.wwww","rRrrrr.www","rRrrrry.ww","rRrrrryy.w","rRrarryyy.","rRrarrryyy","rRaaarryyy","rRrarrryyy"]);
  var QUEEN = mir([
    "......y..y",".....yyyyy",".....yybyz","...hhhhhhh","..hhhhhhhh","..hhhsssss",".hhhssssss",".hhsKKssss",
    ".hhssKssss",".hhspsssss",".hhssssssS",".hhsssssmm",".hhhssssss",".hhhhSssss","hhhhhhwwww","hhhhhwwwww",
    "hhhrrwwwww","hhrrrrwwwy","hrrrrrrrww","rRrrrrrrrr","rRrrarrrrr","rRrraarrrr","rRrrarrryy","rRrrrrrryy"]);
  var JACK = mir([
    "..........","..........","....aaaaaa","..aaaaaaaa",".aaaaaaaaa",".yyyyyyyyy","..ooosssss","..oossssss",
    "..oosKssss","..ospsssss","..ossssssS","..ossssssm","...sssssss","....Ssssss","..wwwwwwww",".wwwwwwwww",
    "rrrwwwwwyy","rRrrrrrryy","rRrrrrryyr","rRrrrryyrr","rRrrryyrrr","rRrryyrrrr","rRryyrrrrr","rRyyrrrrrr"]);
  // asymmetric feather on the jack's cap
  [[16,0],[17,0],[15,1],[16,1],[17,1],[14,2],[15,2],[16,2],[13,3],[14,3]].forEach(function(p){
    var r = JACK[p[1]]; JACK[p[1]] = r.substr(0,p[0]) + 'e' + r.substr(p[0]+1);
  });
  var JESTER = mir([
    "y.........","aa........",".aa.......",".aaa....rr","..aaa.rrrr","..aaaarrrr","...aaarrrr","...yyyyyyy",
    "...sssssss","...ssKssss","...spsssss","...smsssss","....smmmmm",".....sssss","..wywywywy",".ywywywywy",
    "..aaaarrrr","..aaaarrrr"]);

  function palette(suit){
    var red = suit === 1 || suit === 2;
    return {K:'#1b1030',y:'#ffd23f',Y:'#c88a10',s:'#f8c890',S:'#d8925a',p:'#f08080',w:'#ffffff',g:'#d0d0e0',G:'#8888a0',
      h:'#7a4020',H:'#4a2410',o:'#f0b030',O:'#b87818',b:'#3878ff',z:'#e02040',e:'#30b050',m:'#b02030',
      r: red ? '#d8141c' : '#2848c8', R: red ? '#8a0a12' : '#182878', a: red ? '#2848c8' : '#d8141c'};
  }
  function px(ctx,x,y,c){ ctx.fillStyle=c; ctx.fillRect(x,y,1,1); }
  function bitmap(ctx,rows,x,y,col,scale){
    scale = scale || 1; ctx.fillStyle = col;
    for (var j=0;j<rows.length;j++) for (var i=0;i<rows[j].length;i++) if (rows[j][i]==='X') ctx.fillRect(x+i*scale,y+j*scale,scale,scale);
  }
  function sprite(ctx,rows,x,y,pal){
    var h = rows.length, w = rows[0].length, i, j;
    var on = function(i,j){ return j>=0&&j<h&&i>=0&&i<w&&rows[j][i]!=='.'; };

    for (j=-1;j<=h;j++) for (i=-1;i<=w;i++) if (!on(i,j) && (on(i-1,j)||on(i+1,j)||on(i,j-1)||on(i,j+1))) px(ctx,x+i,y+j,'#1b1030');
    for (j=0;j<h;j++) for (i=0;i<w;i++){ var c=rows[j][i]; if (c!=='.') px(ctx,x+i,y+j,pal[c]); }
  }
  function blank(){
    var cv = document.createElement('canvas'); cv.width=W; cv.height=H;
    var ctx = cv.getContext('2d');
    ctx.fillStyle='#2a2a44'; ctx.fillRect(2,0,W-4,H); ctx.fillRect(0,2,W,H-4); ctx.fillRect(1,1,W-2,H-2);
    ctx.fillStyle='#ffffff'; ctx.fillRect(2,1,W-4,H-2); ctx.fillRect(1,2,W-2,H-4);
    ctx.fillStyle='#e4e4ee'; ctx.fillRect(2,H-3,W-4,1); ctx.fillRect(W-3,2,1,H-4);

  }
  function chip(ctx,x,y,suit){
    var col = (suit===1||suit===2)?RED:BLK;

      if (d<=10.6){
        if (d>7.6){ var a=(Math.atan2(dy,dx)+Math.PI)/(Math.PI*2)*8; c=(Math.floor(a+0.5)%2)?col:'#ffffff'; if (d>9.8) c=col; }

  }
  function tinyWord(ctx,word,x,y,col,scale){
    for (var k=0;k<word.length;k++){ var g=TINY[word[k]]; bitmap(ctx,g,x,y,col,scale); x+=(g[0].length+1)*scale; }
  }
  function tinyWidth(word,scale){ var w=0; for (var k=0;k<word.length;k++) w+=(TINY[word[k]][0].length+1)*scale; return w-scale; }
  var cache = {};
  function face(c, wild){
    var key = c + (wild?'w':''); if (cache[key]) return cache[key];
    var b = blank(), ctx = b.ctx;
    if (c === 52){
      sprite(ctx,JESTER,15,5,{K:'#1b1030',y:'#ffd23f',s:'#f8c890',p:'#f08080',w:'#ffffff',m:'#b02030',r:'#d8141c',a:'#7028c0'});
      tinyWord(ctx,'JOKER',(W-tinyWidth('JOKER',2))>>1,32,'#7028c0',2);
      [[8,50],[40,46],[24,58],[12,62],[36,60]].forEach(function(p){ var x=p[0],y=p[1]; ctx.fillStyle='#ffd23f';
        ctx.fillRect(x,y-2,1,5); ctx.fillRect(x-2,y,5,1); ctx.fillStyle='#c88a10'; px(ctx,x,y,'#fff6b0'); });
    } else {
      var r = c>>2, s = c&3, col = (s===1||s===2)?RED:BLK, ch = '23456789TJQKA'[r];
      if (ch==='T'){ bitmap(ctx,GLYPH[1],3,4,col,2); bitmap(ctx,GLYPH[0],11,4,col,2); }
      else bitmap(ctx,GLYPH[ch],4,4,col,2);
      bitmap(ctx,SUIT[s],4,21,col,1);
      if (r>=9 && r<=11){
        sprite(ctx,[JACK,QUEEN,KING][r-9],27,4,palette(s));
        bitmap(ctx,SUIT[s],28,48,col,2);
      } else if (r===12){
        chip(ctx,25,4,s); bitmap(ctx,SUIT[s],28,48,col,2);
      } else {
        bitmap(ctx,SUIT[s],19,39,col,3);
      }
      if (wild){
        ctx.fillStyle='#1b1030'; ctx.fillRect(1,56,W-2,11); ctx.fillStyle='#ffd23f'; ctx.fillRect(2,57,W-4,9);
        tinyWord(ctx,'WILD',(W-tinyWidth('WILD',1))>>1,59,'#1b1030',1);
      }
    }
    return (cache[key] = b.cv.toDataURL());
  }
  function back(){
    if (cache.back) return cache.back;
    var b = blank(), ctx = b.ctx;
    for (var y=3;y<H-3;y++) for (var x=3;x<W-3;x++){
      var lat = ((x+y)%6===0)||((x-y+66)%6===0);
      px(ctx,x,y, (x<5||y<5||x>W-6||y>H-6) ? '#ffffff' : lat ? '#8a0a12' : '#c8141f');
    }
    chip(ctx,14,24,0);
    return (cache.back = b.cv.toDataURL());
  }
  return {face:face, back:back, chip:chip};
})();

</script>
<script>

];

// ---------- persistence ----------
const KEY='pctk-v2';
let DB={current:null,players:{},settings:{variant:0,hands:1,coins:5,denom:25,speed:0,sound:true,dbl:true}};

  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);

['touchend','pointerdown','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(S.sound)actx()},{capture:true,passive:true}));

const VV=()=>V[S.variant];
const wager=()=>S.coins*S.denom*S.hands;
const rowPay=(row,c)=>(c===5&&row.max)?row.max:row.pay*c;
const rowFor=code=>VV().rows.findIndex(r=>r.codes.includes(code));
const credits=code=>{const i=rowFor(code);return i<0?0:rowPay(VV().rows[i],S.coins)};
const isWild=c=>(VV().mode===1&&c<4)||(VV().mode===2&&c===JOKER);
const src=c=>c==null?CardArt.back():CardArt.face(c,isWild(c));

// ---------- layout ----------
function makeHand(x,y,cw,ch,step,font,coinSize,main){
  const el=document.createElement('div');el.className='hand';const w=step*4+cw;
  el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${ch}px`;
  const imgs=[];for(let i=0;i<5;i++){const im=new Image();im.style.cssText=`left:${i*step}px;width:${cw}px;height:${ch}px`;im.draggable=false;im.alt='';el.appendChild(im);imgs.push(im)}
  const badge=document.createElement('div');badge.className='badge';badge.style.fontSize=font+'px';badge.hidden=true;el.appendChild(badge);
  const coin=document.createElement('div');coin.className='coin';coin.style.cssText=`width:${coinSize}px;height:${coinSize}px;left:${w-coinSize*.6}px;top:${ch-coinSize*.6}px;font-size:${Math.round(coinSize*.55)}px`;el.appendChild(coin);
  const h={el,imgs,badge,coin,keys:[]};
  if(main){h.labels=[];h.slots=[];for(let i=0;i<5;i++){
    const lb=document.createElement('div');lb.className='held';lb.textContent='HELD';lb.style.cssText=`left:${x+i*step}px;top:${y-28}px;width:${cw}px;font-size:${cw>100?22:19}px`;
    const sl=document.createElement('div');sl.className='slot';sl.style.cssText=`left:${x+i*step}px;top:${y-28}px;width:${cw}px;height:${ch+28}px`;sl.onclick=()=>{actx();slotTap(i)};
    h.labels.push(lb);h.slots.push(sl)}}
  return h;
}
function layout(){
  const hz=$('hz');hz.innerHTML='';const n=S.hands,single=n===1;
  $('pt').hidden=!single;$('ptL').hidden=$('ptR').hidden=single;$('msg').hidden=!single;
  let main,ex=[];
  if(single){main=makeHand(131,250,125,175,143,19,26,true)}
  else{
    main=n===3?makeHand(254,276,84,118,92,15,20,true):makeHand(239,n===5?248:288,90,126,98,15,20,true);
    if(n===3){for(let k=0;k<2;k++)ex.push(makeHand(254,6+k*124,84,118,92,15,20))}
    if(n===5){for(let k=0;k<4;k++)ex.push(makeHand(k%2?500:270,8+(k>>1)*110,70,98,30,12,16))}
    if(n===10){for(let k=0;k<9;k++)ex.push(makeHand(232+(k%3)*172,8+Math.floor(k/3)*86,56,78,24,10,14))}
  }
  ex.forEach(h=>hz.appendChild(h.el));hz.appendChild(main.el);
  main.labels.forEach(l=>hz.appendChild(l));main.slots.forEach(s=>hz.appendChild(s));
  H={main,ex};
  if(X.length!==ex.length) X=ex.map(()=>({disp:[null,null,null,null,null],label:null}));
}

// ---------- rendering ----------
function setImg(h,i,c,dim){const k=String(c);const im=h.imgs[i];
  if(h.keys[i]!==k){im.src=src(c);h.keys[i]=k;if(c!=null){im.classList.remove('flip');void im.offsetWidth;im.classList.add('flip')}}
  im.classList.toggle('dim',!!dim)}
function setBadge(h,lab){if(!lab){h.badge.hidden=true;return}h.badge.hidden=false;h.badge.innerHTML=`<span>${lab[0]}</span><span>${n0(lab[1])}</span>`}
function renderHands(){
  if(!H)return; const m=H.main, dbl=!!G.dbl;
  for(let i=0;i<5;i++){
    setImg(m,i,disp[i],dbl&&G.dbl.picked>=0&&i!==0&&i!==G.dbl.picked);
    const lb=m.labels[i];
    if(dbl){lb.textContent=i===0?'DEALER':(G.dbl.picked===i?'YOURS':'');lb.className='held on'+(i===0?' dealer':'')}
    else{lb.textContent='HELD';lb.className='held'+(G.held[i]?' on':'')}
  }
  m.coin.textContent=S.coins; m.coin.hidden=dbl;
  setBadge(m,dbl||S.hands===1?null:G.mainLabel);
  H.ex.forEach((h,k)=>{const x=X[k];for(let i=0;i<5;i++)setImg(h,i,x.disp[i]);h.coin.textContent=S.coins;setBadge(h,x.label)});
}
function renderPaytable(winRows,dealtRow){
  const v=VV(),rows=v.rows;winRows=winRows||new Set();
  if(S.hands===1){
    const fs=rows.length>11?13:rows.length>9?15:17;
    let h='';rows.forEach((r,i)=>{const w=winRows.has(i)?' win':(i===dealtRow?' dealt':'');
      h+=`<div class="l${w}" style="font-size:${fs}px">${r.label}</div>`;
      for(let c=1;c<=5;c++)h+=`<div class="c${c===S.coins?' act':''}${w}" style="font-size:${fs}px">${n0(rowPay(r,c))}</div>`});
    $('pt').innerHTML=h;$('pt').style.gridTemplateRows=`repeat(${rows.length},minmax(0,1fr))`;
  } else {
    const half=Math.ceil(rows.length/2),gap=rows.length>11?5:8;
    const box=(r,i)=>`<div class="pbox${winRows.has(i)?' win':''}"><div class="pl" style="font-size:${rows.length>11?12:14}px">${r.short}</div><div class="pv">${n0(rowPay(r,S.coins))}</div></div>`;
    $('ptL').innerHTML=rows.slice(0,half).map((r,i)=>box(r,i)).join('');$('ptR').innerHTML=rows.slice(half).map((r,i)=>box(r,i+half)).join('');
    $('ptL').style.gap=$('ptR').style.gap=gap+'px';
  }
}
let shown=0,rollTok=0;
function showCredits(){$('credM').textContent='CREDITS '+n0(shown/S.denom)}
function setCredits(){rollTok++;shown=P?P.bank:0;showCredits();refreshStrip()}
function rollCredits(){const tok=++rollTok,from=shown,to=P.bank,diff=to-from;refreshStrip();
  if(diff<=0||S.speed===2){shown=to;showCredits();return}
  const dur=Math.min(2400,250+Math.sqrt(diff/S.denom)*80),t0=performance.now();let lt=0;
  const step=t=>{if(tok!==rollTok)return;const p=Math.min(1,(t-t0)/dur);shown=from+diff*p;showCredits();if(t-lt>55){sfx.tick();lt=t}if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step)}
function refreshStrip(){if(!P)return;const n=net(P);
  $('strip').innerHTML=`<span>♠ <b>${esc(P.name)}</b></span><span>BANK <b>${money(P.bank)}</b></span><span>OWE THE HOUSE <b class="${P.owed?'neg':''}">${money(P.owed)}</b></span><span>NET <b class="${n<0?'neg':n>0?'pos':''}">${signed(n)}</b></span><span>DEEPEST HOLE <b class="${P.deepest<0?'neg':''}">${money(P.deepest)}</b></span>`;
  $('owe').querySelector('span').textContent='OWE '+money(P.owed).replace('.00','');
  $('owe').querySelector('i').style.width=Math.min(100,P.owed/(P.owed+Math.max(P.bank,1))*100)+'%';}
function status(t){$('gstat').textContent=t}
function msg(t,big){const m=$('msg');m.textContent=t||'';m.classList.toggle('big',!!big)}
function syncButtons(){
  const ph=G.phase,free=ph==='idle'||ph==='over',offer=offerDouble();
  $('bDeal').textContent=ph==='hold'?'DRAW':'DEAL';
  $('bDeal').disabled=busy||!(free||ph==='hold');
  $('bUp').textContent=offer?'DOUBLE':'BET UP'; $('bMax').textContent=offer?'TAKE WIN':'BET MAX';
  $('bUp').classList.toggle('grn',offer);$('bMax').classList.toggle('grn',offer);
  $('bUp').disabled=$('bMax').disabled=busy||!free&&!(ph==='double');
  if(ph==='double'){$('bUp').disabled=true;$('bMax').textContent='TAKE WIN';$('bMax').disabled=busy;$('bMax').classList.add('grn')}
  $('coinBtn').disabled=$('bMenu').disabled=busy||!free;
  $('hint').disabled=busy||ph!=='hold';
  $('coinBtn').textContent=denomLbl(S.denom);
  $('bSpeed').innerHTML='SPEED '+[0,1,2].map(i=>`<i class="${i<=S.speed?'on':''}">›</i>`).join('');
  $('betM').textContent='BET '+n0(S.coins*S.hands);
  $('gname').textContent=VV().name+(S.hands>1?` · ${S.hands} PLAY`:'');
  $('winM').textContent='WIN '+n0(G.lastWin);
}
function refresh(){renderPaytable();renderHands();setCredits();syncButtons()}
const offerDouble=()=>S.dbl&&G.phase==='over'&&G.lastWin>0&&!G.collected&&G.dblCount<MAX_DOUBLES&&!busy;

// ---------- game flow ----------
function shortDialog(){
  const busted=P.bank<S.denom*S.hands;
  modal(`<h2>${busted?'BUSTED!':'SHORT ON CASH!'}</h2><p>${busted?'Your bankroll is tapped out.':`This bet costs ${money(wager())} and you have ${money(P.bank)}.`}<br>The house will spot you another <b style="color:#ffe23a">$100</b>.<br>You'd owe <b style="color:#ff7a7a">${money(P.owed+LOAN)}</b>.</p>
   <div class="row"><button class="btn red" data-a="loan">BORROW $100</button>${busted?'':'<button class="btn" data-a="lower">LOWER MY BET</button>'}<button class="btn" data-a="no">NOT NOW</button></div>`,
   {loan:()=>{takeLoan();close();status('+$100 LOAN');refresh()},lower:()=>{lowerBet();close()},no:close});
}
function lowerBet(){while(wager()>P.bank&&S.coins>1)S.coins--;let di=DENOMS.indexOf(S.denom);while(wager()>P.bank&&di>0){S.denom=DENOMS[--di]}save();refresh()}
async function deal(){
  if(busy)return; const v=VV(),w=wager();
  if(P.bank<w){shortDialog();return}
  busy=true;G.lastWin=0;G.dblCount=0;G.collected=false;G.dbl=null;G.mainLabel=null;
  P.bank-=w;P.wagered+=w;P.hands+=S.hands;track();setCredits();
  G.deck=shuffle(makeDeck(v.joker));G.hand=G.deck.splice(0,5);G.rem=G.deck.slice();G.held=[false,false,false,false,false];
  X=H.ex.map(()=>({disp:[null,null,null,null,null],label:null}));
  disp=[null,null,null,null,null];G.phase='dealing';msg('');status('GOOD LUCK!');
  renderHands();renderPaytable();syncButtons();
  for(let i=0;i<5;i++){await sleep(SPEEDS[S.speed]);disp[i]=G.hand[i];X.forEach(x=>{});renderHands();sfx.deal()}
  const ri=rowFor(evaluate(G.hand,v.mode,v.minPair));renderPaytable(null,ri);
  if(ri>=0)msg(v.rows[ri].label);
  G.phase='hold';busy=false;status('HOLD CARDS, THEN DRAW');syncButtons();
}
function slotTap(i){
  if(G.phase==='double'){pick(i);return}
  if(G.phase!=='hold'||busy)return;
  G.held[i]=!G.held[i];G.held[i]?sfx.hold():sfx.unhold();
  X.forEach(x=>{x.disp=G.hand.map((c,j)=>G.held[j]?c:null)});renderHands();
}
async function draw(){
  const v=VV();busy=true;G.phase='drawing';syncButtons();msg('');
  for(let i=0;i<5;i++)if(!G.held[i])disp[i]=null;
  X.forEach(x=>{const d=shuffle(G.rem.slice());let q=0;x.cards=G.hand.map((c,j)=>G.held[j]?c:d[q++]);x.disp=G.hand.map((c,j)=>G.held[j]?c:null);x.label=null});
  renderHands();await sleep(SPEEDS[S.speed]);
  for(const x of X){x.disp=x.cards.slice();if(X.length<=4){renderHands();sfx.deal();await sleep(SPEEDS[S.speed]*.8)}}
  if(X.length>4){renderHands();sfx.deal();await sleep(SPEEDS[S.speed])}
  const fin=G.hand.slice();let p=0;
  for(let i=0;i<5;i++)if(!G.held[i]){fin[i]=G.deck[p++];disp[i]=fin[i];renderHands();sfx.deal();await sleep(SPEEDS[S.speed])}
  // settle
  const rows=new Set();let tot=0,wins=0,royal=false;
  const settle=cards=>{const code=evaluate(cards,v.mode,v.minPair),ri=rowFor(code);if(code===C.NRF)royal=true;
    if(ri<0)return null;const cr=credits(code);rows.add(ri);tot+=cr;wins++;return [v.rows[ri].short,cr]};
  G.mainLabel=settle(fin); X.forEach(x=>x.label=settle(x.cards));
  renderHands();renderPaytable(rows);
  G.lastWin=tot;
  if(tot>0){
    const cash=tot*S.denom;P.bank+=cash;P.won+=cash;P.biggest=Math.max(P.biggest,cash);if(royal)P.royals++;track();rollCredits();
    royal||tot>=25*S.coins?sfx.big():sfx.win();
    if(S.hands===1)msg(G.mainLabel[0].toUpperCase(),true);
    status(`WINNER! ${money(cash)}`+(S.hands>1?` · ${wins} HAND${wins>1?'S':''}`:''));
  } else {track();status('GAME OVER');refreshStrip()}
  G.phase='over';busy=false;syncButtons();
  if(offerDouble())status(`WINNER! DOUBLE UP ${n0(G.lastWin)} CREDITS?`);
  if(P.bank<S.denom&&tot===0)setTimeout(shortDialog,600);
}
function startDouble(){
  if(!offerDouble())return;
  G.phase='double';G.dbl={deck:shuffle(makeDeck(false)),picked:-1};
  disp=[G.dbl.deck[0],null,null,null,null];G.mainLabel=null;X.forEach(x=>x.label=null);
  if(S.hands===1){msg('PICK A CARD TO BEAT THE DEALER')}
  status(`DOUBLE UP ${n0(G.lastWin)} — PICK A CARD`);renderPaytable();renderHands();syncButtons();sfx.btn();
}
async function pick(i){
  if(G.phase!=='double'||busy||i===0||G.dbl.picked>=0)return;
  busy=true;syncButtons();const d=G.dbl.deck;G.dbl.picked=i;disp[i]=d[i];renderHands();sfx.deal();
  await sleep(Math.max(300,SPEEDS[S.speed]*3));
  for(let j=1;j<5;j++)disp[j]=d[j];
  const me=d[i]>>2,dl=d[0]>>2,amt=G.lastWin*S.denom;
  G.phase='over';
  if(me>dl){P.bank+=amt;P.won+=amt;G.lastWin*=2;G.dblCount++;P.biggest=Math.max(P.biggest,G.lastWin*S.denom);rollCredits();sfx.win();msg('YOU WIN! DOUBLED!',true);status(`DOUBLED TO ${money(G.lastWin*S.denom)}`)}
  else if(me===dl){G.dblCount++;msg('PUSH');status('PUSH — WIN STANDS')}
  else{P.bank-=amt;P.won-=amt;G.lastWin=0;setCredits();sfx.lose();msg('DEALER WINS');status('GAME OVER')}
  track();busy=false;renderHands();syncButtons();
  if(offerDouble())status(status_=`DOUBLE AGAIN? ${n0(G.lastWin)} CREDITS`);
}
let status_='';
function takeWin(){if(busy)return;G.collected=true;if(G.phase==='double'){G.phase='over'}sfx.cash();status(`COLLECTED ${money(G.lastWin*S.denom)}`);msg(G.lastWin?'WIN COLLECTED':'');syncButtons()}
function hint(){
  if(G.phase!=='hold'||busy)return;const v=VV();busy=true;syncButtons();status('THINKING…');
  const pay=new Float64Array(NCODES);for(let c=0;c<NCODES;c++){const i=rowFor(c);pay[c]=i<0?0:rowPay(v.rows[i],S.coins)/S.coins}
  setTimeout(()=>{const ev=enumerateEV(G.hand,G.rem,v.mode,v.minPair,pay);let cur=0;G.held.forEach((h,i)=>{if(h)cur|=1<<i});
    let best=0;for(let m=1;m<32;m++)if(ev[m]>ev[best]+1e-12)best=m;
    G.held=[0,1,2,3,4].map(i=>!!(best&(1<<i)));X.forEach(x=>{x.disp=G.hand.map((c,j)=>G.held[j]?c:null)});
    renderHands();sfx.hold();busy=false;syncButtons();
    status(`BEST HOLD RETURNS ${ev[best].toFixed(2)}/COIN`+(cur===best?'':` (YOURS ${ev[cur].toFixed(2)})`));},30);
}
function onDeal(){actx();if(busy)return;if(G.phase==='hold')draw();else if(G.phase==='idle'||G.phase==='over')deal();else if(G.phase==='double'){takeWin()}}
function betUp(){if(offerDouble())return startDouble();if(busy||!(G.phase==='idle'||G.phase==='over'))return;S.coins=S.coins%5+1;sfx.btn();save();renderPaytable();renderHands();syncButtons()}
function betMax(){if(offerDouble()||G.phase==='double')return takeWin();if(busy||!(G.phase==='idle'||G.phase==='over'))return;S.coins=5;save();renderPaytable();renderHands();syncButtons();deal()}

// ---------- menus ----------
function openMenu(){
  if(busy||!(G.phase==='idle'||G.phase==='over'))return;
  const seg=(arr,cur,key,lab)=>`<div class="seg">${arr.map((x,i)=>`<button class="btn${(key==='g'?i:x)===cur?' sel':''}" data-a="${key}:${key==='g'?i:x}">${lab(x)}</button>`).join('')}</div>`;
  const acts={close,sw:()=>{close();backToSplash()},
    loan:()=>{takeLoan();openMenu()},
    pay:()=>{const x=Math.min(LOAN,P.owed,P.bank);if(x<=0)return;P.bank-=x;P.owed-=x;P.repaid+=x;track();sfx.cash();setCredits();openMenu()},
    payall:()=>{const x=Math.min(P.owed,P.bank);if(x<=0)return;P.bank-=x;P.owed-=x;P.repaid+=x;track();sfx.cash();setCredits();openMenu()}};
  V.forEach((v,i)=>acts['g:'+i]=()=>{S.variant=i;resetTable();save();openMenu()});
  HANDS.forEach(h=>acts['h:'+h]=()=>{S.hands=h;resetTable();save();openMenu()});
  const canPay=P.owed>0&&P.bank>0;
  modal(`<h2>${esc(P.name)}'S LEDGER</h2><div class="ledger two">${ledgerRows()}</div>
    <div class="row" style="margin-bottom:12px"><button class="btn grn" data-a="pay" ${canPay?'':'disabled'}>PAY BACK $100</button><button class="btn grn" data-a="payall" ${canPay?'':'disabled'}>PAY ALL I CAN</button><button class="btn red" data-a="loan">BORROW $100</button></div>
    <div class="lbl">GAME</div>${seg(V,S.variant,'g',v=>v.name)}
    <div class="lbl">HANDS</div>${seg(HANDS,S.hands,'h',h=>h+(h>1?' PLAY':' HAND'))}
    <div class="row"><button class="btn" data-a="sw">SWITCH PLAYER</button><button class="btn red" data-a="close">BACK TO GAME</button></div>`,acts,{enter:close});
}
function openOptions(){
  const acts={close,snd:()=>{S.sound=!S.sound;save();if(S.sound){actx();sfx.btn()}else if(silentEl){silentEl.pause()}openOptions()},dbl:()=>{S.dbl=!S.dbl;save();syncButtons();openOptions()}};
  modal(`<h2>OPTIONS</h2>
   <div class="row" style="justify-content:flex-start;margin-bottom:14px"><button class="btn${S.sound?' sel':''}" data-a="snd">SOUND: ${S.sound?'ON':'OFF'}</button><button class="btn" data-a="dbl">DOUBLE UP: ${S.dbl?'ON':'OFF'}</button></div>
   <p style="font-size:17px">Keys: SPACE/ENTER deal &amp; draw · 1–5 hold · U bet up · M bet max · H hint · S speed<br>Paytables are standard full-pay versions. HINT solves every possible draw for the best hold.</p>
   <div class="row"><button class="btn red" data-a="close">BACK TO GAME</button></div>`,acts,{enter:close});
}
function resetTable(){G.phase='idle';G.lastWin=0;G.dbl=null;G.mainLabel=null;G.held=[false,false,false,false,false];disp=[null,null,null,null,null];X=[];layout();refresh();msg('');status('PRESS DEAL')}
function backToSplash(){$('game').hidden=true;$('splash').hidden=false;renderFame()}

// ---------- wiring ----------
$('bDeal').onclick=onDeal;$('bUp').onclick=()=>{actx();betUp()};$('bMax').onclick=()=>{actx();betMax()};
$('bMenu').onclick=()=>{sfx.btn();openMenu()};$('bOpt').onclick=()=>{sfx.btn();openOptions()};$('owe').onclick=()=>{sfx.btn();openMenu()};
$('bSpeed').onclick=()=>{S.speed=(S.speed+1)%3;save();sfx.btn();syncButtons()};
$('coinBtn').onclick=()=>{if(busy)return;S.denom=DENOMS[(DENOMS.indexOf(S.denom)+1)%DENOMS.length];save();sfx.btn();setCredits();syncButtons()};
$('hint').onclick=hint;
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(!$('modal').hidden){if(e.key==='Enter'&&modalKeys&&modalKeys.enter&&e.target.tagName!=='INPUT'){e.preventDefault();modalKeys.enter()}return}
  if(!$('splash').hidden){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('play').click()}return}
  const k=e.key.toLowerCase();
  if(k===' '||k==='enter'){e.preventDefault();onDeal()}
  else if(k>='1'&&k<='5'){actx();slotTap(+k-1)}
  else if(k==='u')betUp(); else if(k==='m')betMax(); else if(k==='h')hint(); else if(k==='s')$('bSpeed').click();
});
})();
</script>
</body>
